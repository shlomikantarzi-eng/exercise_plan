<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.K | תוכנית האימונים של שלומי</title>
  <style>
    :root {
      --bg: #0b1329;
      --card: #152238;
      --card-inner: #1c2e4a;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #22c55e;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      padding-bottom: 95px;
    }
    .brand-header {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid #334e68;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-tag {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #fff;
      font-weight: 900;
      font-size: 0.95rem;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 1px;
    }
    .brand-name {
      font-size: 1.05rem;
      font-weight: bold;
      color: #fff;
    }

    /* טאבים ראשיים */
    .top-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: var(--card);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid #1e3a5f;
    }
    .top-tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1rem;
      font-weight: bold;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .top-tab-btn.active {
      background: var(--accent);
      color: #0b1329;
    }

    h2 { color: #fff; font-size: 1.15rem; margin: 4px 0 10px 0; }
    
    /* מעקב 8 שבועות */
    .weeks-tracker {
      background: var(--card);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #1e3a5f;
    }
    .weeks-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .week-btn {
      background: var(--card-inner);
      border: 1px solid #334e68;
      color: var(--muted);
      border-radius: 8px;
      padding: 8px 4px;
      text-align: center;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .week-btn input { display: none; }
    .week-btn.checked {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: bold;
    }

    /* כרטיסיות */
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      border: 1px solid #1e293b;
    }
    .badge {
      display: inline-block;
      background: var(--accent-glow);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .macro-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      text-align: center;
      background: var(--card-inner);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 0.8rem;
    }
    .macro-item strong { display: block; color: var(--accent); font-size: 0.95rem; }
    
    .todo-item {
      display: flex;
      align-items: flex-start;
      margin: 14px 0;
      font-size: 0.92rem;
      cursor: pointer;
      line-height: 1.4;
    }
    .todo-item input {
      margin-left: 10px;
      margin-top: 3px;
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      flex-shrink: 0;
    }
    .muscle-name {
      color: #38bdf8;
      font-weight: 600;
    }
    .weight-instruction {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 2px;
    }
    
    /* כפתור הדרכה */
    .video-btn {
      display: inline-flex;
      align-items: center;
      margin-top: 6px;
      background: #0284c7;
      color: white;
      border: none;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 5px 12px;
      border-radius: 6px;
      gap: 4px;
      cursor: pointer;
    }
    .video-btn:hover { background: #0369a1; }

    /* חלון הדרכה מוגדל (Modal) */
    .video-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    .video-modal.active { display: flex; }
    .modal-content {
      background: var(--card);
      border-radius: 16px;
      width: 95%;
      max-width: 650px;
      overflow: hidden;
      border: 1px solid #334e68;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: var(--card-inner);
    }
    .modal-header h3 { margin: 0; font-size: 1.05rem; color: #fff; }
    .close-btn {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 1.6rem;
      font-weight: bold;
      cursor: pointer;
    }
    .modal-body {
      padding: 16px;
    }
    .tech-box {
      background: #0b1329;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #1e3a5f;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .tech-box strong { color: var(--accent); }
    .direct-link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ef4444;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      gap: 6px;
    }

    /* טיימר מנוחה */
    .timer-bar {
      background: var(--card-inner);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }
    .timer-btn {
      background: #0284c7;
      border: none;
      color: white;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* ניווט תחתון */
    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0f172a;
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      border-top: 1px solid #1e293b;
      z-index: 100;
    }
    .nav button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .nav button.active { color: var(--accent); }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .reset-btn {
      background: none;
      border: 1px solid #ef4444;
      color: #ef4444;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- כותרת ממותגת -->
  <div class="brand-header">
    <div class="brand-title">
      <span class="brand-tag">S.K</span>
      <span class="brand-name">תוכנית האימונים של שלומי 👑</span>
    </div>
    <button class="reset-btn" onclick="resetTasks()">אפס שבוע</button>
  </div>

  <!-- טאבים ראשיים -->
  <div class="top-tabs">
    <button id="topBtnWorkout" class="top-tab-btn active" onclick="switchTab('workout')">🏋️ תוכנית אימונים</button>
    <button id="topBtnNutrition" class="top-tab-btn" onclick="switchTab('nutrition')">🥗 תפריט 3 ארוחות</button>
  </div>

  <!-- ==================== טאב 1: אימונים ==================== -->
  <div id="workout" class="tab-content active">

    <!-- מעקב 8 שבועות -->
    <div class="weeks-tracker">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="font-size:0.9rem;">🎯 מעקב תוכנית (8 שבועות להערכה מחדש):</strong>
        <span id="completedWeeksCount" style="color:var(--accent); font-size:0.85rem;">0/8 שבועות</span>
      </div>
      <div class="weeks-grid">
        <label class="week-btn" id="w1"><input type="checkbox" onchange="toggleWeek(1)"> שבוע 1</label>
        <label class="week-btn" id="w2"><input type="checkbox" onchange="toggleWeek(2)"> שבוע 2</label>
        <label class="week-btn" id="w3"><input type="checkbox" onchange="toggleWeek(3)"> שבוע 3</label>
        <label class="week-btn" id="w4"><input type="checkbox" onchange="toggleWeek(4)"> שבוע 4</label>
        <label class="week-btn" id="w5"><input type="checkbox" onchange="toggleWeek(5)"> שבוע 5</label>
        <label class="week-btn" id="w6"><input type="checkbox" onchange="toggleWeek(6)"> שבוע 6</label>
        <label class="week-btn" id="w7"><input type="checkbox" onchange="toggleWeek(7)"> שבוע 7</label>
        <label class="week-btn" id="w8"><input type="checkbox" onchange="toggleWeek(8)"> שבוע 8</label>
      </div>
    </div>

    <!-- טיימר מנוחה -->
    <div class="timer-bar">
      <span>⏱️ מנוחה בין סטים: <strong id="timerDisplay">מוכן</strong></span>
      <div>
        <button class="timer-btn" onclick="startTimer(60)">60 שנ'</button>
        <button class="timer-btn" onclick="startTimer(90)">90 שנ'</button>
      </div>
    </div>

    <!-- ראשון -->
    <div class="card">
      <span class="badge">יום ראשון</span>
      <h2>עליון A (חזה + כתף אמצעית)</h2>
      
      <label class="todo-item">
        <input type="checkbox" id="t1">
        <div>
          <strong>לחיצת חזה על ספה:</strong> 4 × 8–12 <span class="muscle-name">(עובד על שריר חזה גדול + יד אחורית)</span>
          <span class="weight-instruction">📌 משקל מוצע: דאמבלס 17.5 ק"ג או מוט 20 ק"ג (טמפו איטי 3 שנ' בירידה).</span>
          <button class="video-btn" onclick="openExerciseGuide('לחיצת חזה עם משקולות', 'שמור על חזה מורם, כתפיים צמודות לספה וירידה מבוקרת של 3 שניות עד מתיחה מלאה.', 'dumbbell+bench+press+shorts')">🎬 צפה בהדגמה</button>
        </div>
      </label>

      <label class="todo-item">
        <input type="checkbox" id="t2">
        <div>
          <strong>עליות מתח:</strong> 4 × 6–10 <span class="muscle-name">(עובד על שריר הגב הרחב + יד קדמית)</span>
          <span class="weight-instruction">📌 משקל מוצע: משקל גוף / ווסט משקל להעמסה נוספת.</span>
          <button class="video-btn" onclick="openExerciseGuide('עליות מתח', 'משיכה מחזה אל המוט, שאיבת שכמות לאחור וירידה איטית ומלאה.', 'pull+ups+form+shorts')">🎬 צפה בהדגמה</button>
        </div>
      </label>

      <label class="todo-item">
        <input type="checkbox" id="t3">
        <div>
          <strong>הרחקות לצדדים:</strong> 4 × 15–20 <span class="muscle-name">(עובד על שריר הכתף האמצעית - לבניית רוחב V)</span>
          <span class="weight-instruction">📌 משקל מוצע: דאמבלס 5–8 ק"ג (תנועה נקייה ללא תנופת גוף).</span>
          <button class="video-btn" onclick="openExerciseGuide('הרחקות לצדדים', 'הרמה מבוקרת לגובה הכתפיים עם מרפקים מעט כפופים, ללא תנופת גוף.', 'dumbbell+lateral+raise+shorts')">🎬 צפה בהדגמה</button>
        </div>
      </label>

      <label class="todo-item">
        <input type="checkbox" id="t4">
        <div>
          <strong>שכיבות סמיכה בטבעות:</strong> 3 סטים עד כשל <span class="muscle-name">(עובד על שריר חזה + מייצבי כתף)</span>
          <span class="weight-instruction">📌 משקל מוצע: משקל גוף / ווסט משקל (מתיחה עמוקה בתחתית).</span>
          <button class="video-btn" onclick="openExerciseGuide('שכיבות סמיכה בטבעות', 'ייצוב ליבה, ירידה איטית עד מתיחה עמוקה של החזה ולחיצה חזקה.', 'gymnastic+rings+push+ups+shorts')">🎬 צפה בהדגמה</button>
        </div>
      </label>

      <label class="todo-item">
        <input type="checkbox" id="t5">
        <div>
          <strong>כפיפות מרפקים:</strong> 3 × 10–12 <span class="muscle-name">(עובד על שריר היד הקדמית - בייספס)</span>
          <span class="weight-instruction">📌 משקל מוצע: דאמבלס 8–10 ק"ג.</span>
          <button class="video-btn" onclick="openExerciseGuide('כפיפות מרפקים לדאמבלס', 'מרפקים מקובעים לצד הגוף, סופינציה קלה בשיא הכיווץ.', 'dumbbell+bicep+curls+form+shorts')">🎬 צפה בהדגמה</button>
        </div>
      </label>
    </div>

    <!-- שני -->
    <div class="card">
      <span class="badge">יום שני</span>
      <h2>תחתון A + ליבה עמוקה</h2>

      <label class="todo-item">
        <input type="checkbox" id="t6">
        <div>
          <strong>סקוואט:</strong> 4 × 8–12 <span class="muscle-name">(עובד על שריר הארבע-ראשי + ישבן)</span>
          <span class="weight-instruction">📌 משקל מוצע: מוט 20 ק"ג / דאמבלס 17.5 ק"ג + שילוב ווסט משקל.</span>
          <button class="video-btn" onclick="openExerciseGuide('סקוואט / גובלט סקוואט', 'חזה זקוף, ברכיים נעות בכיוון הבהונות, ירידה מתחת למקביל.', 'goblet+squat+form+shorts')">🎬 צפה בהדגמה</button>
        </div>
      </label>

      <label class="todo-item">
        <input type="checkbox" id="t7">
        <div>
          <strong>לאנג'ים:</strong> 3 × 10 לכל רגל <span class="muscle-name">(עובד על שריר הישבן + ארבע-ראשי ומייצבי אגן)</span>
          <span class="weight-instruction">📌 משקל מוצע: דאמבלס 10–17.5 ק"ג או ווסט משקל.</span>
          <button class="video-btn" onclick="openExerciseGuide('לאנגים עם משקולות', 'צעד יציב קדימה, 90 מעלות בשני המפרקים ודחיפה מהעקב הקדמי.', 'dumbbell+lunges+form+shorts')">🎬 צפה בהדגמה</button>
        </div>
      </label>

      <label class="todo-item">
        <input type="checkbox" id="t8">
        <div>
          <strong>רומניאן דדליפט (RDL):</strong> 3 × 10–12 <span class="muscle-name">(עובד על שריר הירך האחורית - המסטרינגס וישבן)</span>
          <span class="weight-instruction">📌 משקל מוצע: מוט 20 ק"ג או דאמבלס 17.5 ק"ג (מתיחה מלאה).</span>
          <button class="video-btn" onclick="openExerciseGuide('רומניאן דדליפט (RDL)', 'דחיפת הישבן לאחור (ציר ירך), גב ישר ומתיחה מלאה של ההמסטרינגס.', 'dumbbell+rdl+form+shorts')">🎬 צפה בהדגמה</button>
        </div>
      </label>

      <label class="todo-item">
        <input type="checkbox" id="t9">
        <div>
          <strong>גלגל בטן (Ab Wheel):</strong> 3 × 8–12 <span class="muscle-name">(עובד על שריר הבטן הרוחבי - TVA להידוק מותניים)</span>
          <span class="weight-instruction">📌 משקל מוצע: משקל גוף מבוקר (ללא כפיפות צד).</span>
          <button class="video-btn" onclick="openExerciseGuide('גלגל בטן (Ab Wheel)', 'גלגול איטי מברכיים, שאיבת בטן פנימה ושמירה על גב ללא קשת תחתונה.', 'ab+wheel+rollout+shorts')">🎬 צפה בהדגמה</button>
        </div>
      </label>
    </div>

    <!-- שלישי -->
    <div class="card">
      <span class="badge">יום שלישי</span>
      <h2>התאוששות אקטיבית ואירובי LISS</h2>

      <label class="todo-item">
        <input type="checkbox" id="t10">
        <div>
          <strong>הליכת בוקר 05:30–06:30 (60 דק'):</strong> קצב מהיר רציף <span class="muscle-name">(שריפת שומן בטני ומותני ללא סטרס שרירי)</span>
          <span class="weight-instruction">📌 ללא משקולות / ללא עומס על מפרקי הידיים.</span>
        </div>
      </label>

      <label class="todo-item">
        <input type="checkbox" id="t11">
        <div>
          <strong>מתיחות וניידות:</strong> 10 דקות <span class="muscle-name">(שחרור מפרקי הכתפיים, אגן ושורש כף היד)</span>
          <button class="video-btn" onclick="openExerciseGuide('מתיחות וניידות', 'שחרור כתפיים, תנועתיות מפרק כף היד ומתיחות המסטרינגס.', 'upper+body+mobility+routine+shorts')">🎬 צפה בהדגמה</button>
        </div>
      </label>
    </div>

    <!-- רביעי -->
    <div class="card">
      <span class="badge">יום רביעי</span>
      <h2>עליון B (גב + כתף אמצעית)</h2>

      <label class="todo-item">
        <input type="checkbox" id="t12">
        <div>
          <strong>לחיצת כתפיים (OHP):</strong> 4 × 8–12 <span class="muscle-name">(עובד על שריר הכתף הקדמית והאמצעית)</span>
          <span class="weight-instruction">📌 משקל מוצע: מוט 20 ק"ג או דאמבלס 10–17.5 ק"ג.</span>
          <button class="video-btn" onclick="openExerciseGuide('לחיצת כתפיים (OHP)', 'לחיצה ישרה למעלה תוך כיווץ ישבן וליבה, ללא הישענות מוגזמת לאחור.', 'overhead+shoulder+press+form+shorts')">🎬 צפה בהדגמה</button>
        </div>
      </label>

      <label class="todo-item">
        <input type="checkbox" id="t13">
        <div>
          <strong>חתירה בכיפוף (Row):</strong> 4 × 8–10 <span class="muscle-name">(עובד על שריר הגב האמצעי + טרפזים)</span>
          <span class="weight-instruction">📌 משקל מוצע: מוט עם 10 ק"ג כל צד / דאמבלס 17.5 ק"ג.</span>
          <button class="video-btn" onclick="openExerciseGuide('חתירה בכיפוף (Barbell/Dumbbell Row)', 'גב ישר ב-45 מעלות, משיכת המוט/דאמבלס לכיוון הפופיק וכיווץ שכמות.', 'bent+over+row+form+shorts')">🎬 צפה בהדגמה</button>
        </div>
      </label>

      <label class="todo-item">
        <input type="checkbox" id="t14">
        <div>
          <strong>טבילות (Dips) בטבעות:</strong> 3 × 8–10 <span class="muscle-name">(עובד על שריר החזה התחתון + יד אחורית)</span>
